# Render Blueprint — https://render.com/docs/blueprint-spec
# Disk berterusan memerlukan plan berbayar (Starter). Tanpa disk, tempahan HILANG setiap kali deploy/restart.
services:
  - type: web
    name: repairphone-booking
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/bookings.json
      - key: ADMIN_KEY
        generateValue: true
      - key: SHOP_NAME
        sync: false
      - key: SHOP_ADDRESS
        sync: false
      - key: SHOP_WHATSAPP
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
